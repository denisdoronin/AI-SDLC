name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Lint, type-check and test (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      # `[dependency-groups]` is PEP 735, not a PEP 621 extra, so `.[dev]` does
      # not work. `pip install --group` needs pip >= 25.1, which is newer than
      # the pip bundled with the runner's Python.
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and dev dependencies
        run: pip install -e . --group dev

      - name: Lint with ruff
        run: ruff check .

      - name: Type-check with mypy
        run: mypy

      # pytest exit code 5 means "no tests collected". The suite is currently
      # empty, so tolerate 5 only; every other non-zero code must fail the job.
      - name: Run tests with pytest
        shell: bash
        run: |
          set +e
          pytest
          status=$?
          set -e
          if [ "$status" -eq 5 ]; then
            echo "::notice::pytest collected no tests (exit code 5); treating as pass."
            exit 0
          fi
          exit "$status"
